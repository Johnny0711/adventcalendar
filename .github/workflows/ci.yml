name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: bash -n scripts/deploy.sh scripts/update.sh scripts/install-deploy-hook.sh .githooks/post-merge
      - run: npm test
      - run: docker build -t private-advent:test .
